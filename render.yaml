services:
  - type: web
    name: skill-matching
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-xxxxx.oregon-postgres.render.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: skill_matching_system
      - key: DB_USERNAME
        value: skill_matching_user
      - key: DB_PASSWORD
        value: your_password_here
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: skill-matching-db
    plan: free
    databaseName: skill_matching_system
    user: skill_matching_user
